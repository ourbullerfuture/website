<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Message sent — Our Buller Future</title>
<style>
  :root{--paper:#faf8f5;--ink:#1f2427;--ink-soft:#4d565a;--teal:#14606f;--teal-dark:#0d4451;--line:#ded7cd;color-scheme:light}
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:18px;line-height:1.6;
    display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;
  }
  .box{max-width:560px}
  h1{
    font-family:Georgia,"Iowan Old Style","Times New Roman",serif;
    font-size:clamp(28px,5vw,40px);line-height:1.2;margin:0 0 16px;font-weight:600;
  }
  p{color:var(--ink-soft);margin:0 0 14px}
  a.back{
    display:inline-block;margin-top:18px;background:var(--teal);color:#fff;
    text-decoration:none;font-weight:600;font-size:16px;padding:13px 26px;border-radius:3px;
  }
  a.back:hover{background:var(--teal-dark)}
</style>
</head>
<body>
  <div class="box">
    <h1>Thanks, your message has been sent.</h1>
    <p>One of the organisers will get back to you.</p>
    <p>If you were asking about paper signature sheets, we will be in touch with how to get some.</p>
    <a class="back" href="/">Back to the open letter</a>
  </div>
</body>
</html>
